version: "2"
type: backend
tech_stack:
  - Kotlin
  - Jetpack Compose
  - Android SDK
  - Room Database
  - SharedPreferences
  - WorkManager
features:
  - name: Restriction Management
    description: Add, update and remove application restrictions and daily limits.
    files:
      - app/src/main/java/com/gardiyan/app/viewmodel/GuardianViewModel.kt
      - app/src/main/java/com/gardiyan/app/ui/screens/ProtectedAppsScreen.kt
    endpoints:
      - method: POST
        path: /restrictions/add
        description: Add a new application restriction
        auth_required: false
        response_schema:
          "200": Success
      - method: DELETE
        path: /restrictions/remove
        description: Remove an application restriction
        auth_required: false
        response_schema:
          "200": Success
      - method: GET
        path: /restrictions/list
        description: Get list of active restricted apps
        auth_required: false
        response_schema:
          "200": Restriction[]
  - name: Quote Management
    description: Save, edit and delete custom motivational quotes.
    files:
      - app/src/main/java/com/gardiyan/app/ui/screens/SavedQuotesScreen.kt
    endpoints:
      - method: POST
        path: /quotes/add
        description: Add a new custom quote
        auth_required: false
        response_schema:
          "200": Quote
      - method: DELETE
        path: /quotes/delete
        description: Delete a custom quote
        auth_required: false
        response_schema:
          "200": Success
known_limitations: []
