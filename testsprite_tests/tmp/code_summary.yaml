version: "2"
type: backend
tech_stack:
  - Kotlin
  - Android SDK
  - Jetpack Compose
  - Room Database
  - WorkManager
features:
  - name: Guardian Repository Management
    description: Core repository handling protected daily counters, session creation, and streaking logic.
    files:
      - app/src/main/java/com/gardiyan/app/data/repository/GuardianRepository.kt
    endpoints:
      - method: GET
        path: /repository/session
        description: Fetch active user session information
        auth_required: false
        response_schema:
          "200": UserSessionEntity
      - method: POST
        path: /repository/reset
        description: Secure daily counter reset
        auth_required: false
        response_schema:
          "200": success
  - name: Block Overlay Enforcement
    description: Draw a window overlay on top of protected applications once daily limit is exceeded.
    files:
      - app/src/main/java/com/gardiyan/app/service/BlockOverlayService.kt
    endpoints:
      - method: POST
        path: /service/overlay/show
        description: Trigger lock screen overlay
        auth_required: false
        response_schema:
          "200": success
known_limitations: []
