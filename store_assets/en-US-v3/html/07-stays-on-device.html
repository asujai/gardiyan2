<!doctype html><html lang='en'><head><meta charset='utf-8'><style>
@font-face{font-family:NR;src:url('../fonts/newsreader_regular.ttf');font-weight:400}
@font-face{font-family:NR;src:url('../fonts/newsreader_medium.ttf');font-weight:500}
@font-face{font-family:NR;src:url('../fonts/newsreader_italic.ttf');font-style:italic;font-weight:400}
@font-face{font-family:MR;src:url('../fonts/manrope_regular.ttf');font-weight:400}
@font-face{font-family:MR;src:url('../fonts/manrope_semibold.ttf');font-weight:600}
@font-face{font-family:MR;src:url('../fonts/manrope_bold.ttf');font-weight:700}
@font-face{font-family:MR;src:url('../fonts/manrope_extrabold.ttf');font-weight:800}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0F0E0C}
body{position:relative;font-family:MR,sans-serif;color:#F2EBDD;-webkit-font-smoothing:antialiased}
.glow{position:absolute;inset:0;background:
  radial-gradient(1200.0px 900.0px at var(--gx,50%) var(--gy,100%),rgba(217,165,91,.20),transparent 68%)}
.copy{position:absolute;z-index:5}
h1{font-family:NR;font-weight:400;color:#F2EBDD;letter-spacing:-.018em;line-height:1.0}
h1 em{font-style:italic;color:#D9A55B}
p.sub{font-family:MR;font-weight:400;color:#B4AC9B;line-height:1.42}
.phone{position:absolute;overflow:hidden;background:#000;
  box-shadow:0 0 280.0px rgba(217,165,91,.22),0 40.0px 120.0px rgba(0,0,0,.85)}
.phone::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  border:4.0px solid rgba(242,235,221,.26)}
.phone img{display:block}
</style></head><body style='--gx:50%;--gy:78%'><div class='glow'></div><div class='copy' style='left:84px;top:118px;width:912px'><h1 style='font-size:134px'>Nothing leaves<br><em>your phone.</em></h1><p class='sub' style='font-size:40px;margin-top:34px;max-width:857.28px'>Limitra works fully offline. Your usage data stays on this device.</p></div><style>
.ledger{position:absolute;left:84px;top:690px;width:912px;z-index:3}
.row{display:flex;align-items:baseline;gap:22px;padding:56px 0;border-bottom:2px solid rgba(242,235,221,.14)}
.row:first-child{border-top:2px solid rgba(242,235,221,.14)}
.lbl{font-family:NR;font-size:80px;line-height:1;color:#F2EBDD;letter-spacing:-.01em}
.dots{flex:1;border-bottom:4px dotted rgba(242,235,221,.22);transform:translateY(-10px)}
.none{font-family:NR;font-style:italic;font-size:80px;line-height:1;color:#D9A55B}
.pill{position:absolute;left:84px;top:1640px;z-index:3;display:flex;align-items:center;gap:24px;
  padding:30px 44px;border:3px solid rgba(217,165,91,.55);border-radius:999px;
  font-family:MR;font-weight:600;font-size:38px;color:#F2EBDD}
.pill svg{width:52px;height:52px}
</style><div class='ledger'><div class='row'><span class='lbl'>Accounts</span><span class='dots'></span><span class='none'>None</span></div><div class='row'><span class='lbl'>Ads</span><span class='dots'></span><span class='none'>None</span></div><div class='row'><span class='lbl'>Trackers</span><span class='dots'></span><span class='none'>None</span></div><div class='row'><span class='lbl'>Internet permission</span><span class='dots'></span><span class='none'>None</span></div></div><div class='pill'><svg viewBox='0 0 24 24' fill='none' stroke='#D9A55B' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3 4.5 6v5.5c0 4.3 3 7.7 7.5 9.5 4.5-1.8 7.5-5.2 7.5-9.5V6L12 3z'/><path d='m8.6 12.2 2.4 2.4 4.4-4.8'/></svg>Works with no internet at all</div></body></html>
